<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoF Crafter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="login-screen" class="login-screen">
    <div class="studio-card">
      <!-- 카드 헤더 밴드 -->
      <div class="card-header">
        <img src="source/rof-crafter-logo.png" alt="RoF Crafter" class="card-logo" />
        <div class="card-header-text">
          <div class="card-studio-name">RoF Studio</div>
          <div class="card-header-sub">방문자 정보 카드</div>
        </div>
      </div>
      <!-- 접수 폼 테이블 -->
      <form id="login-form" class="card-form" autocomplete="off">
        <table class="info-table">
          <tbody>
            <tr>
              <td class="field-label">이름</td>
              <td class="field-input">
                <input type="text" id="login-userid" placeholder="정자로 입력하세요" required />
              </td>
            </tr>
            <tr>
              <td class="field-label">생년월일</td>
              <td class="field-input">
                <input type="text" id="login-password" placeholder="6자리 입력" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required />
              </td>
            </tr>
            <tr class="gender-row">
              <td class="field-label">성별</td>
              <td class="field-input">
                <div class="gender-check-group">
                  <label class="gender-check">
                    <input type="radio" name="login-gender" value="female" checked />
                    <span class="check-box"></span>
                    <span class="check-label">여성</span>
                  </label>
                  <label class="gender-check">
                    <input type="radio" name="login-gender" value="male" />
                    <span class="check-box"></span>
                    <span class="check-label">남성</span>
                  </label>
                  <label class="gender-check">
                    <input type="radio" name="login-gender" value="neutral" />
                    <span class="check-box"></span>
                    <span class="check-label">선택 안 함</span>
                  </label>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="consent-row">
          <label class="consent-check">
            <input type="checkbox" id="login-consent" required />
            <span class="consent-box"></span>
            <span class="consent-text">개인정보 수집 · 이용에 동의합니다<span class="consent-required"> (필수)</span></span>
          </label>
        </div>
        <div id="login-error" class="login-error" style="display:none;"></div>
        <div class="card-actions">
          <button type="submit" id="btn-login" class="btn-secondary login-btn">입장</button>
          <button type="button" id="btn-register" class="btn-primary login-btn">등록</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 메인 음성 대화 화면 -->
  <div id="app" class="voice-app" style="display:none;">

    <!-- 최상단 미니 상태바 -->
    <header class="voice-header">
      <span id="connection-status" class="status-dot disconnected"></span>
      <span id="progress-text" class="voice-progress-text">0 / 0</span>
      <button id="btn-logout" class="btn-voice-close" title="로그아웃">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </header>
    <div id="video-status" class="video-status" style="display:none;">
      <div class="video-status-spinner"></div>
      <div class="video-status-text"></div>
    </div>
    <div class="summary-spinner" id="summary-spinner"></div>

    <!-- 숨겨진 요소 (기존 로직 호환) -->
    <span id="user-badge" style="display:none;"></span>
    <span id="session-id" style="display:none;"></span>
    <div id="progress-fill" style="display:none;"></div>

    <!-- 중앙 오브 영역 -->
    <main class="voice-main">
      <div class="orb-container" id="orb-container">
        <canvas id="orb-canvas" width="280" height="340"></canvas>
        <div class="orb-glow" id="orb-glow"></div>
        <div class="low-volume-bubble" id="low-volume-bubble" aria-hidden="true">
          조금만 더 크게 말해주세요 🎙️
        </div>
        <div class="low-volume-bubble high-noise" id="high-noise-bubble" aria-hidden="true">
          주변이 시끄러워요, 조용한 곳으로 이동해 주세요 🔇
        </div>
      </div>
      <p class="voice-status-text" id="voice-status-text"></p>
      <p class="voice-subtitle" id="voice-subtitle"></p>
    </main>

    <!-- 실시간 전사 (하단 오버레이) -->
    <section class="voice-transcript" id="live-transcript-section" style="display:none;">
      <p id="live-transcript" class="voice-transcript-text"></p>
    </section>

    <!-- 하단 컨트롤 -->
    <footer class="voice-footer">
      <div class="mic-btn-wrapper">
        <div id="record-guide-bubble" class="record-guide-bubble" aria-hidden="true">
          버튼을 꾹 누른 상태로 답변해 주세요.
        </div>
        <button id="btn-start" class="voice-mic-btn push-to-talk" disabled>
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      </div>
      <span id="mic-label" class="voice-mic-label">대기 중</span>
      <button id="btn-end-session" class="btn-end-voice" disabled>대화 종료</button>
    </footer>

    <!-- 채팅 메시지 (숨겨진 데이터 저장용) -->
    <div id="conversation" style="display:none;">
      <div id="chat-messages" class="chat-messages"></div>
    </div>

    <!-- 오디오 비주얼라이저 (숨김, 오브에서 사용) -->
    <canvas id="visualizer-canvas" width="300" height="40" style="display:none;"></canvas>

    <!-- 비디오 생성 영역 -->
    <section id="video-section" class="video-section-voice" style="display:none;">
      <div id="video-controls" class="video-controls-voice">
        <input type="file" id="video-image-input" accept="image/*" style="display:none;" />
        <button id="btn-open-camera" class="file-upload-label-voice" type="button">
          <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;">photo_camera</span>
          <span id="video-image-label-text">프로필 사진 촬영</span>
        </button>
        <button id="btn-generate-video" class="btn-primary btn-icon" disabled>
          <span class="material-symbols-outlined btn-video-icon">videocam</span>
          <span class="btn-video-spinner"></span>
        </button>
      </div>
      <!-- 카메라 촬영 모달 -->
      <div id="camera-modal" class="camera-modal" style="display:none;">
        <div class="camera-modal-content">
          <video id="camera-preview" autoplay playsinline></video>
          <canvas id="camera-capture-canvas" style="display:none;"></canvas>
          <img id="camera-captured-img" class="camera-captured-img" style="display:none;" />
          <div class="camera-controls">
            <button id="btn-camera-close" class="btn-camera-action btn-camera-close-style" type="button">취소</button>
            <button id="btn-camera-capture" class="btn-camera-action btn-camera-capture-style" type="button">
              <span class="material-symbols-outlined">photo_camera</span>
            </button>
            <button id="btn-camera-retake" class="btn-camera-action btn-camera-close-style" type="button" style="display:none;">다시 촬영</button>
            <button id="btn-camera-confirm" class="btn-camera-action btn-camera-confirm-style" type="button" style="display:none;">사용하기</button>
          </div>
        </div>
      </div>
      <div id="video-result" class="video-result" style="display:none;">
        <p class="video-complete-msg">RoF Studio로 입장해 주세요.</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
